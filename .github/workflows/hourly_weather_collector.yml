name: Continuous Seri Iskandar Weather Collector

on:
  schedule:
    # Runs every hour at minute 5 to continuously log Seri Iskandar weather & forecasts at RM 0.00 cost
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  collect-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run Open-Meteo Collector for Seri Iskandar
        run: python -m src.collector --past-days 5

      - name: Commit updated SQLite DB & CSV snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(data): automated Seri Iskandar Open-Meteo telemetry sync"
          git push
